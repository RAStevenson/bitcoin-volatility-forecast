[project]
name = "bitcoin-volatility-forecast"
version = "1.0.0"
description = "Daily quantile forecast of BTC-USD hourly realized volatility from eight models under rolling-origin scoring, committed before its first target hour ends and scored in a public record"
authors = [{ name = "Robert Andrew Stevenson" }]
requires-python = ">=3.11"
license = { text = "MIT" }

# Install is optional by design: entry scripts in scripts/ bootstrap
# src/ onto sys.path, so a fresh clone runs with no install step.

[tool.pyright]
# Type checking at the level a reader's editor runs by default (Pylance
# in VS Code reads this section too), with pandas-stubs pinned in
# requirements.txt so pandas calls resolve. A finding is fixed with
# explicit code; an ignore comment is used only where a library's own
# typing is wrong, and says so.
include = ["src", "scripts", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
# The rule set the repo is checked against, stated so a newer ruff on a
# CI runner applies the same rules as the one on the development machine.
select = ["E4", "E7", "E9", "F"]
