[project]
name = "volatility-forecast-harness"
version = "1.0.0"
description = "Benchmarking harness for quantile volatility forecasts: six model families, two of them baselines, under rolling-origin evaluation, with a daily self-scoring live loop"
authors = [{ name = "Robert Andrew Stevenson" }]
requires-python = ">=3.11"
license = { text = "MIT" }

# Install is optional by design: entry scripts in scripts/ bootstrap
# src/ onto sys.path, so a fresh clone runs with no install step.

[tool.ruff.lint]
# The rule set the repo is checked against, stated so a newer ruff on a
# CI runner applies the same rules as the one on the development machine.
select = ["E4", "E7", "E9", "F"]
