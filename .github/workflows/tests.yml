name: Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "results/**"
      - "data/**"
  pull_request:

jobs:
  pytest:
    # Pinned rather than ubuntu-latest, which GitHub moves to Ubuntu 26
    # from 2026-10-19; a new image is adopted on purpose, not by surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the CPU stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: ruff check src scripts tests
      - run: pyright
      - run: python -m pytest tests -q
