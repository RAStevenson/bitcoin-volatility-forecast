name: Daily run

on:
  schedule:
    - cron: "15 11 * * *"   # fallback: the origin is the 10:00 UTC hour,
                             # which closes at 11:00, and its first target
                             # hour ends at 12:00. The on-time start is a
                             # Task Scheduler dispatch from the author's
                             # machine at 11:15 (setup in
                             # docs/daily_briefing_prompt.md); GitHub's
                             # schedule is best-effort and fired 4h26m late
                             # on its first day, 2026-09-27
    - cron: "45 11 * * *"   # second fallback; does nothing once committed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "run with --no-commit (nothing committed or pushed)"
        type: boolean
        default: true
      refit_today:
        description: "dry run only: fit every model again even when today's forecast is logged, and print how far each refit lands"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    # Pinned rather than ubuntu-latest, which GitHub moves to Ubuntu 26
    # from 2026-10-19; a new image is adopted on purpose, not by surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the timing audit reads the full history
      # actions/checkout pins the tree to the commit the run was created
      # on, so a run queued behind another would otherwise test a stale
      # commit, re-run the day, and have its push rejected (2026-09-28,
      # two dispatches a second apart). Move to the branch's real tip
      # first, then ask whether the day has committed.
      - name: Move to the branch tip
        run: |
          git fetch origin master
          git checkout -B master origin/master
      # Any commit in the last thirty, not only the newest: an edit
      # pushed after the day's run must not make a fallback re-run it.
      - name: Skip when today's run has already committed
        id: today
        run: |
          if git log -30 --format=%s | grep -q "^Daily run $(date -u +%F)"; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      # A real run, scheduled or dispatched, skips once the day has
      # committed; only a dry run goes ahead regardless.
      - uses: actions/setup-python@v5
        if: steps.today.outputs.done == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the CPU stack
        if: steps.today.outputs.done == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Git identity for the run's commit
        if: steps.today.outputs.done == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Daily run
        if: steps.today.outputs.done == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REFIT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.refit_today }}
        run: |
          # A dry run after the day has committed would otherwise fit
          # nothing, because the daily run skips any model already logged
          # for the origin; --refit-today fits them all again and compares,
          # without writing to the log.
          if [ "$REFIT" = "true" ]; then
            python scripts/run_daily.py --no-commit --refit-today
          elif [ "$DRY" = "true" ]; then
            python scripts/run_daily.py --no-commit
          else
            python scripts/run_daily.py
          fi
